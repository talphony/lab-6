spring.application.name=fbs

# Страховой буфер (IDEF0 A3, управление): сколько штук не показывать площадкам
wms.safety-buffer=0

# Планировщик A3 (компонент «Планировщик» на C4 L3)
wms.order-processing.interval=PT2M
wms.order-processing.scheduler-enabled=true

# Демо-режим для ручной проверки A3 (эндпоинты /api/demo/*). В рабочей системе выключить.
wms.demo.enabled=true
